name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://sgyhpiyfznlwsdujeyah.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          echo "Sending keep-alive ping to Supabase..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/")
          echo "Supabase response status: ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
            echo "Supabase instance ping succeeded."
          else
            echo "Warning: Unexpected response status ${HTTP_STATUS}"
          fi
